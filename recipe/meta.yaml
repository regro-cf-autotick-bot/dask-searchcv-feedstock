{% set name = "dask-searchcv" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c1eaa9271dadc0d25659550352e883402dc7c28a217209c4715d5b46556a8565

build:
  noarch: python
  number: 1
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - dask >=0.14.0
    - numpy >=1.8.0
    - scikit-learn >=0.18.0
    - scipy >=0.13.0
    - toolz >=0.8.2

test:
  requires:
    - python {{ python_min }}
  imports:
    - dask_searchcv

about:
  home: http://dask-searchcv.readthedocs.io/
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: 'Tools for doing hyperparameter search with Scikit-Learn and Dask'
  doc_url: http://dask-searchcv.readthedocs.io/
  dev_url: https://github.com/dask/dask-searchcv

extra:
  recipe-maintainers:
    - jcrist
